<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="A quiet, interactive foggy mirror.">
    <title>Foggy Mirror</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=11">
  </head>
  <body>
    <main class="app" aria-label="Foggy Mirror">
      <video id="camera" playsinline muted aria-hidden="true"></video>
      <canvas id="mirror" tabindex="0" aria-label="Interactive foggy mirror"></canvas>
      <p class="status is-hidden" id="status" role="status"></p>
      <div class="mirror-controls" id="mirrorControls" hidden>
        <div id="lipstickCursor" class="lipstick-cursor" aria-hidden="true" hidden><span class="lipstick-icon"></span></div>
        <div id="lipstickPalette" class="lipstick-palette" role="group" aria-label="Lipstick shades" hidden>
          <button type="button" class="shade" data-shade="0" style="--shade: #c9142f" aria-label="Cherry" aria-pressed="true" title="Cherry"></button>
          <button type="button" class="shade" data-shade="1" style="--shade: #d8232a" aria-label="Classic red" aria-pressed="false" title="Classic red"></button>
          <button type="button" class="shade" data-shade="2" style="--shade: #7c1023" aria-label="Wine" aria-pressed="false" title="Wine"></button>
          <button type="button" class="shade" data-shade="3" style="--shade: #e33a80" aria-label="Hot pink" aria-pressed="false" title="Hot pink"></button>
          <button type="button" class="shade" data-shade="4" style="--shade: #e75a45" aria-label="Coral" aria-pressed="false" title="Coral"></button>
          <button type="button" class="shade" data-shade="5" style="--shade: #a2544e" aria-label="Rosewood" aria-pressed="false" title="Rosewood"></button>
        </div>
        <div class="bottom-controls">
          <div class="toolbar" aria-label="Brush controls">
            <i data-lucide="sparkle" aria-hidden="true"></i>
            <input id="brushSize" type="range" min="4" max="40" step="1" value="15" aria-label="Brush size" title="Brush size">
            <button id="lipstickTool" type="button" aria-label="Lipstick" aria-pressed="false" title="Lipstick"><span class="lipstick-icon" aria-hidden="true"></span></button>
            <button id="wipeTool" type="button" aria-label="Broad wipe" aria-pressed="false" title="Broad wipe"><i data-lucide="hand" aria-hidden="true"></i></button>
            <button id="fogTool" type="button" aria-label="Hold to fog" title="Hold to fog"><i data-lucide="cloud" aria-hidden="true"></i></button>
            <button id="micRetry" type="button" aria-label="Enable microphone" title="Enable microphone" hidden><i data-lucide="mic-off" aria-hidden="true"></i></button>
          </div>
          <div class="mirror-actions">
            <button class="clear-button" id="clearButton" type="button" title="Clear the mirror (C)"><i data-lucide="eraser" aria-hidden="true"></i><span>Clear</span></button>
            <button class="shutter" id="shutterButton" type="button" aria-label="Take photo" title="Take photo (S)"></button>
          </div>
        </div>
      </div>
      <pre id="readouts" class="readouts" hidden aria-label="Mirror readouts"></pre>
      <div id="flash" aria-hidden="true"></div>
      <section class="permission-panel" id="permissionPanel" aria-labelledby="startTitle">
        <div class="start-copy">
          <h1 id="startTitle">Foggy Mirror</h1>
          <p>Uses your camera and microphone.</p>
          <button id="startButton" class="primary-button" type="button">Start</button>
          <p id="permissionHint" class="permission-hint" role="status"></p>
        </div>
        <small class="shortcuts">
          <span><kbd>space</kbd>fog it up</span>
          <span><kbd>S</kbd>save a photo</span>
          <span><kbd>C</kbd>wipe it clean</span>
          <span><kbd>D</kbd>readouts</span>
          <span><kbd>esc</kbd>come back here</span>
        </small>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
    <script src="hand-gestures.js?v=1"></script>
    <script src="breath-detector.js?v=2"></script>
    <script src="lipstick-brush.js?v=3"></script>
    <script src="app.js?v=13"></script>
  </body>
</html>
